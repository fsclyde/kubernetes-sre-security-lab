driver:
  kind: modern_ebpf
falco:
  json_output: true
  json_include_output_property: true
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/rules.d
collectors:
  enabled: true
falcosidekick:
  enabled: false
# Kubernetes audit input is configured through the k8saudit plugin/webhook.
# See docs/setup.md for the API-server webhook limitation and commands.
