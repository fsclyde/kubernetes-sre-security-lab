apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  namespace: mcp
  labels:
    app.kubernetes.io/name: github-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: ghcr.io/github/github-mcp-server:v2.0.2
          args: [http]
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: GITHUB_TOOLSETS
              value: repos,issues,pull_requests
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp
  namespace: mcp
  labels:
    app.kubernetes.io/name: github-mcp
spec:
  selector:
    app.kubernetes.io/name: github-mcp
  ports:
    - name: http
      port: 8082
      targetPort: http
      appProtocol: agentgateway.dev/mcp
