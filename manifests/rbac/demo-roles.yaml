apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app.kubernetes.io/part-of: kubernetes-sre-security-lab
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  labels:
    app.kubernetes.io/part-of: kubernetes-sre-security-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-read
  namespace: mcp
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-write
  namespace: mcp
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: holmes-investigate
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-mcp-read
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-read
    namespace: mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: holmes-investigate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-deployments
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-mcp-write
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-write
    namespace: mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-deployments
